            { id: 'sp13', category: 'sports', name_zh: '田径', name_ms: 'Olahraga', desc_zh: '', desc_ms: '', capacity: 40, icon: 'fa-person-running', color: 'text-red-600 bg-red-50 border-red-200' },
            { id: 'sp14', category: 'sports', name_zh: '乒乓', name_ms: 'Pingpong', desc_zh: '', desc_ms: '', capacity: 40, icon: 'fa-table-tennis-paddle-ball', color: 'text-red-500 bg-red-50 border-red-200' }
        ];

        const STATE = {
            step: 0,
            studentInfo: null,
            selections: { step1: null, step2: null, step3: null },
            userId: null,
            parentEmail: null,
            clubCounts: {} // 实时存储各社团报名人数
        };

        const DOM = {
            viewLogin: document.getElementById('view-login'),
            viewWizard: document.getElementById('view-wizard'),
            authSection: document.getElementById('auth-section'),
            btnGoogleLogin: document.getElementById('btn-google-login'),
            studentForm: document.getElementById('student-form'),
            loginHeaderTitle: document.getElementById('login-header-title'),
            loginHeaderDesc: document.getElementById('login-header-desc'),
            btnLogout: document.getElementById('btn-logout'),
            stepperProgress: document.getElementById('stepper-progress'),
            wizardTitle: document.getElementById('wizard-step-title'),
            wizardDesc: document.getElementById('wizard-step-desc'),
            clubsGrid: document.getElementById('clubs-grid'),
            summaryContainer: document.getElementById('summary-container'),
            summaryList: document.getElementById('summary-list'),
            summaryMsg: document.getElementById('summary-msg'),
            successContainer: document.getElementById('success-container'),
            successTitle: document.getElementById('success-title'),
            successDesc: document.getElementById('success-desc'),
            wizardNav: document.getElementById('wizard-nav'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnPrevText: document.getElementById('btn-prev-text'),
            btnNextText: document.getElementById('btn-next-text')
        };

        let db, auth, googleProvider;
        const ALLOWED_DOMAINS = ['moe-dl.edu.my', 'gmail.com']; // 供您使用gmail测试

        function setupStaticText() {
            document.getElementById('google-login-text').innerHTML = I18N.googleLogin;
            document.getElementById('label-student-name').innerHTML = I18N.studentName;
            document.getElementById('label-student-class').innerHTML = I18N.studentClass;
            document.getElementById('label-login-btn').innerHTML = I18N.loginBtn;
            DOM.summaryMsg.innerHTML = I18N.summaryMsg;
            DOM.btnPrevText.innerHTML = I18N.btnBack;
            DOM.successTitle.innerHTML = I18N.successTitle;
            DOM.successDesc.innerHTML = I18N.successDesc;
            
            for(let i=1; i<=4; i++) {
                document.getElementById(`step-label-${i}`).innerHTML = I18N[`step${i}Title`];
            }
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                googleProvider = new GoogleAuthProvider();
                googleProvider.setCustomParameters({ prompt: 'select_account' });

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const userEmail = user.email || '';
                        const isAllowed = ALLOWED_DOMAINS.some(domain => userEmail.endsWith('@' + domain));
                        
                        if (!isAllowed) {
                            alert("登入拦截 🛑\n\n为了防止重复填写，系统仅允许使用学生专属的 Google Delima 账号 (@moe-dl.edu.my) 进行登入。");
                            await signOut(auth); 
                            return; 
                        }

                        STATE.userId = user.uid;
                        STATE.parentEmail = userEmail;
                        DOM.btnLogout.classList.remove('hidden');
                        await loadUserData();
                    } else {
                        STATE.userId = null;
                        STATE.parentEmail = null;
                        DOM.btnLogout.classList.add('hidden');
                        showLoginView(true);
                    }
                });
            } catch (error) {
                console.error("Firebase 初始化失败:", error);
            }
        }

        async function handleGoogleLogin() {
            if (!auth) return;
            try {
                DOM.btnGoogleLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Google Login Error:", error);
                if (error.code === 'auth/unauthorized-domain' || error.code === 'auth/operation-not-allowed') {
                    alert(`⚠️ 网域未授权 (${error.code})\n\n请在 Firebase Authentication 的设置中添加此网页域名。\n\n系统现为您切换至【模拟测试模式】，供您体验选课流程。`);
                    STATE.userId = "demo-student-id";
                    STATE.parentEmail = "demo-student@moe-dl.edu.my";
                    DOM.btnLogout.classList.remove('hidden');
                    loadUserData();
                    return;
                }
                alert(`登录失败或已取消。\nRalat log masuk. Sila cuba lagi.\n${error.message}`);
                setupStaticText();
            }
        }

        async function fetchClubCapacities() {
            if (!db || STATE.userId === 'demo-student-id') {
                // 如果是 Demo 模式，随便制造一些假数据
                CLUBS_DATA.forEach(c => STATE.clubCounts[c.id] = Math.floor(Math.random() * 20));
                return;
            }
            try {
                console.log("正在实时获取 Firebase 各社团报名人数...");
                const snapshot = await getDocs(collection(db, 'club_registrations'));
                
                // 初始化计数器
                CLUBS_DATA.forEach(c => STATE.clubCounts[c.id] = 0);

                // 统计每个社团被选择的次数
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.selections) {
                        if (data.selections.step1) STATE.clubCounts[data.selections.step1]++;
                        if (data.selections.step2) STATE.clubCounts[data.selections.step2]++;
                        if (data.selections.step3) STATE.clubCounts[data.selections.step3]++;
                    }
                });

                // 🌟 新增：动态读取后台 admin.html 设定的名额上限
                const capDoc = await getDoc(doc(db, 'club_settings', 'capacities'));
                if (capDoc.exists()) {
                    const customCapacities = capDoc.data();
                    CLUBS_DATA.forEach(c => {
                        if (customCapacities[c.id] !== undefined) {
                            c.capacity = parseInt(customCapacities[c.id]);
                        }
                    });
                }

                console.log("人数与名额统计完成！");
            } catch (e) {
                console.error("同步人数失败:", e);
                alert("读取最新名额失败，请检查网络。\nRalat menyemak kekosongan.");
            }
        }

        async function loadUserData() {
            if (!db || !STATE.userId) {
                showLoginView(true);
                return;
            }
            try {
                if (STATE.userId === 'demo-student-id') {
                    showLoginView(false);
                    return;
                }
                const docRef = doc(db, 'club_registrations', STATE.userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.submitted) {
                        STATE.studentInfo = data.studentInfo;
                        STATE.selections = data.selections;
                        showStep(5);
                        return;
                    }
                }
                showLoginView(false);
            } catch (e) {
                console.error(e);
                showLoginView(false);
            }
        }

        function showLoginView(requiresAuth) {
            STATE.step = 0;
            DOM.viewLogin.classList.remove('hidden');
            DOM.viewWizard.classList.add('hidden');
            
            if (requiresAuth) {
                DOM.authSection.classList.remove('hidden');
                DOM.studentForm.classList.add('hidden');
                DOM.loginHeaderTitle.innerHTML = I18N.loginTitle;
                DOM.loginHeaderDesc.innerHTML = I18N.loginSub;
                setupStaticText();
            } else {
                DOM.authSection.classList.add('hidden');
                DOM.studentForm.classList.remove('hidden');
                DOM.loginHeaderTitle.innerHTML = I18N.studentProfile;
                DOM.loginHeaderDesc.innerHTML = I18N.studentProfileSub;
            }
        }

        async function handleStudentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('input-student-name').value.trim();
            const cls = document.getElementById('input-student-class').value.trim();
            if (name && cls) {
                STATE.studentInfo = { name, cls };
                
                // 重点：计算各社团当前真实人数，防止满额超收
                const submitBtn = DOM.studentForm.querySelector('button[type="submit"]');
                const originalContent = submitBtn.innerHTML;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 读取最新名额...`;
                submitBtn.disabled = true;

                await fetchClubCapacities();

                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
                showStep(1);
            }
        }

        async function handleLogout() {
            if (auth && auth.currentUser) await signOut(auth);
            STATE.userId = null;
            STATE.parentEmail = null;
            STATE.studentInfo = null;
            STATE.selections = { step1: null, step2: null, step3: null };
            STATE.clubCounts = {};
            document.getElementById('student-form').reset();
            DOM.btnLogout.classList.add('hidden');
            setupStaticText();
            showLoginView(true);
        }

        function showStep(stepNum) {
            STATE.step = stepNum;
            if (stepNum === 0) {
                showLoginView(!STATE.userId);
            } else {
                DOM.viewLogin.classList.add('hidden');
                DOM.viewWizard.classList.remove('hidden');
                updateStepperUI();
                renderCurrentStep();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStepperUI() {
            if (STATE.step >= 5) {
                DOM.wizardNav.classList.add('hidden');
                return;
            }
            DOM.wizardNav.classList.remove('hidden');
            const progress = (STATE.step - 1) * 33.33;
            DOM.stepperProgress.style.width = `${progress}%`;

            for (let i = 1; i <= 4; i++) {
                const circle = document.getElementById(`step-circle-${i}`);
                const label = document.getElementById(`step-label-${i}`);
                
                if (i < STATE.step) {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    label.classList.replace('text-gray-500', 'text-brand-700');
                } else if (i === STATE.step) {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-brand-100 shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.classList.replace('text-gray-500', 'text-brand-700');
                } else {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.classList.replace('text-brand-700', 'text-gray-500');
                }
            }
        }

        function renderCurrentStep() {
            DOM.clubsGrid.classList.add('hidden');
            DOM.summaryContainer.classList.add('hidden');
            DOM.successContainer.classList.add('hidden');
            
            DOM.btnPrev.classList.toggle('hidden', STATE.step === 1 || STATE.step === 5);
            DOM.btnNext.classList.toggle('hidden', STATE.step === 5);
            
            if (STATE.step <= 3) {
                DOM.clubsGrid.classList.remove('hidden');
                DOM.wizardTitle.innerHTML = I18N[`step${STATE.step}Title`];
                DOM.wizardDesc.innerHTML = I18N[`step${STATE.step}Desc`];
                DOM.btnNextText.innerHTML = I18N.btnNext;
                renderClubsGrid();
            } else if (STATE.step === 4) {
                DOM.summaryContainer.classList.remove('hidden');
                DOM.wizardTitle.innerHTML = I18N.summaryTitle;
                DOM.wizardDesc.innerHTML = I18N.summaryDesc;
                DOM.btnNextText.innerHTML = I18N.btnSubmit;
                renderSummary();
                DOM.btnNext.disabled = false;
            } else if (STATE.step === 5) {
                DOM.successContainer.classList.remove('hidden');
                DOM.wizardTitle.parentElement.classList.add('hidden');
                renderSuccess();
            }
        }

        function renderClubsGrid() {
            const categories = ['uniform', 'society', 'sports'];
            const currentCat = categories[STATE.step - 1];
            const stepKey = `step${STATE.step}`;
            const selectedId = STATE.selections[stepKey];
            const clubs = CLUBS_DATA.filter(c => c.category === currentCat);
            
            DOM.clubsGrid.innerHTML = '';
            
            clubs.forEach(club => {
                const currentEnrolled = STATE.clubCounts[club.id] || 0;
                const isFull = currentEnrolled >= club.capacity;
                const isChecked = selectedId === club.id;
                const card = document.createElement('div');
                card.className = "relative";
                
                card.innerHTML = `
                    <input type="radio" name="club-selection" id="${club.id}" value="${club.id}" 
                           class="club-card-input peer sr-only" ${isFull && !isChecked ? 'disabled' : ''} ${isChecked ? 'checked' : ''}>
                    <label for="${club.id}" class="club-card-label flex p-4 cursor-pointer bg-white border border-gray-200 rounded-xl transition-all h-full hover:border-brand-400 hover:shadow-md">
                        <div class="flex-shrink-0 mr-4 mt-1">
                            <div class="w-14 h-14 rounded-full ${club.color} flex items-center justify-center text-2xl shadow-sm border">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-gray-900 leading-tight text-[15px]">${club.name_zh}</h3>
                                    <h3 class="font-bold text-gray-900 leading-tight text-[15px] mt-1 mb-1">${club.name_ms}</h3>
                                </div>
                                <div class="check-icon opacity-0 transform scale-50 transition-all text-brand-600 bg-brand-100 rounded-full w-6 h-6 flex items-center justify-center flex-shrink-0 ml-2 shadow-sm border border-brand-200">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </div>
                            </div>
                            
                            ${club.desc_zh ? `<div class="text-xs text-orange-700 font-bold mt-2 bg-orange-50 px-2 py-1 rounded inline-block border border-orange-100">${club.desc_zh}<br>${club.desc_ms}</div>` : ''}
                            
                            <div class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold mt-2.5 shadow-sm ${isFull ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-gray-100 text-gray-700 border border-gray-200'}">
                                <i class="fa-solid fa-user-group mr-1.5"></i>
                                ${isFull ? I18N.full : `${currentEnrolled} / ${club.capacity} ${I18N.slots}`}
                            </div>
                        </div>
                    </label>
                `;
                DOM.clubsGrid.appendChild(card);
            });

            const inputs = document.querySelectorAll('input[name="club-selection"]');
            const checkNextState = () => {
                const checked = document.querySelector('input[name="club-selection"]:checked');
                DOM.btnNext.disabled = !checked;
                if(checked) STATE.selections[stepKey] = checked.value;
            };
            inputs.forEach(input => input.addEventListener('change', checkNextState));
            checkNextState();
        }

        function renderSummary() {
            DOM.summaryList.innerHTML = '';
            const cats = ['uniform', 'society', 'sports'];
            
            for (let i = 1; i <= 3; i++) {
                const clubId = STATE.selections[`step${i}`];
                const club = CLUBS_DATA.find(c => c.id === clubId);
                const stepCatName = I18N[cats[i-1]];
                
                if (club) {
                    DOM.summaryList.innerHTML += `
                        <div class="flex items-center p-4 bg-white border border-gray-100 rounded-xl shadow-[0_2px_10px_-4px_rgba(0,0,0,0.1)]">
                            <div class="w-10 h-10 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-500 font-bold mr-4 flex-shrink-0 shadow-inner">
                                ${i}
                            </div>
                            <div class="flex-grow">
                                <p class="text-[10px] text-brand-600 font-bold mb-1 tracking-wider uppercase">${stepCatName}</p>
                                <h4 class="font-bold text-gray-900 leading-tight text-[15px]">${club.name_zh}</h4>
                                <h4 class="font-bold text-gray-900 leading-tight text-[15px] mt-0.5">${club.name_ms}</h4>
                            </div>
                            <div class="text-3xl opacity-10 ml-2">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        function renderSuccess() {
            const details = document.getElementById('success-details');
            
            details.innerHTML = `
                <div class="flex justify-between items-center py-3 border-b border-gray-200">
                    <span class="text-gray-500 text-sm">学生姓名<br><span class="uppercase mt-0.5 block">Nama Pelajar</span></span>
                    <span class="font-bold text-gray-900 text-lg uppercase">${STATE.studentInfo.name}</span>
                </div>
                <div class="flex justify-between items-center py-3 mb-3 border-b border-gray-200">
                    <span class="text-gray-500 text-sm">班级<br><span class="uppercase mt-0.5 block">Kelas</span></span>
                    <span class="font-bold text-gray-900 text-lg uppercase">${STATE.studentInfo.cls}</span>
                </div>
                <div class="pt-2">
                    <span class="text-xs text-brand-600 font-bold tracking-widest uppercase mb-3 block border-b border-brand-100 pb-2">Selections / 已选</span>
                    ${[1,2,3].map(i => {
                        const club = CLUBS_DATA.find(c => c.id === STATE.selections[`step${i}`]);
                        return `<div class="text-sm font-medium text-gray-800 py-3 flex items-start gap-3 border-b border-gray-100 last:border-0"><i class="fa-solid fa-check-circle text-brand-500 text-base mt-1 shadow-sm rounded-full"></i> <div><div class="font-bold text-[15px]">${club ? club.name_zh : ''}</div><div class="font-bold text-[15px] text-gray-800 mt-1">${club ? club.name_ms : ''}</div></div></div>`;
                    }).join('')}
                </div>
            `;
        }

        async function submitData() {
            DOM.btnNext.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            DOM.btnNext.disabled = true;
            DOM.btnPrev.disabled = true;
            
            try {
                if (db && STATE.userId) {
                    if (STATE.userId === 'demo-student-id') {
                        console.log("[Demo Mode] 模拟数据保存成功");
                    } else {
                        // 1. 提交前做最后一次查核，防止在这个间隙社团爆满
                        await fetchClubCapacities();
                        let overbooked = false;
                        let overbookedMsg = "";
                        
                        [1, 2, 3].forEach(stepNum => {
                            const clubId = STATE.selections[`step${stepNum}`];
                            const club = CLUBS_DATA.find(c => c.id === clubId);
                            if (club && STATE.clubCounts[clubId] >= club.capacity) {
                                overbooked = true;
                                overbookedMsg += `[${club.name_zh}] `;
                            }
                        });

                        if (overbooked) {
                            alert(`抱歉！您选择的社团 ${overbookedMsg} 刚刚满额了。\nMaaf! Kelab pilihan anda telah penuh.\n\n系统将返回让您重新选择。`);
                            DOM.btnNext.innerHTML = `<span id="btn-next-text">${I18N.btnSubmit}</span> <i class="fa-solid fa-arrow-right"></i>`;
                            DOM.btnNext.disabled = false;
                            DOM.btnPrev.disabled = false;
                            showStep(1); // 退回第一步
                            return;
                        }

                        // 2. 写入资料库
                        const docRef = doc(db, 'club_registrations', STATE.userId);
                        await setDoc(docRef, {
                            studentInfo: STATE.studentInfo,
                            parentEmail: STATE.parentEmail,
                            selections: STATE.selections, // CRITICAL FIX: Save the entire selections object which contains IDs (e.g., 'u1', 's2')
                            submitted: true,
                            timestamp: new Date().toISOString()
                        });
                    }
                }
                
                showStep(5); // 前往成功页面
            } catch (err) {
                console.error(err);
                alert("抱歉，保存数据时出错，请重试。\nRalat menyimpan data.");
                DOM.btnNext.innerHTML = `<span id="btn-next-text">${I18N.btnSubmit}</span> <i class="fa-solid fa-arrow-right"></i>`;
                DOM.btnNext.disabled = false;
                DOM.btnPrev.disabled = false;
            }
        }

        // Event Listeners
        DOM.btnGoogleLogin.addEventListener('click', handleGoogleLogin);
        DOM.studentForm.addEventListener('submit', handleStudentSubmit);
        DOM.btnLogout.addEventListener('click', handleLogout);
        
        DOM.btnPrev.addEventListener('click', () => {
            if (STATE.step > 1) showStep(STATE.step - 1);
        });
        
        DOM.btnNext.addEventListener('click', () => {
            if (STATE.step < 4) {
                showStep(STATE.step + 1);
            } else if (STATE.step === 4) {
                submitData();
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            setupStaticText();
            initFirebase();
        });
    </script>
</body>
</html>
