        const ALLOWED_DOMAINS = ['moe-dl.edu.my', 'gmail.com'];

        async function initFirebase() {
            try {
                // 检查是否已经填入了真实的 API Key
                if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                    console.warn("尚未配置 Firebase Config，请先配置以启用真实登入功能。");
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                googleProvider = new GoogleAuthProvider();
                
                // 强制每次登入时选择账号 (避免浏览器记住旧账号导致无法切换)
                googleProvider.setCustomParameters({ prompt: 'select_account' });

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const userEmail = user.email || '';
                        const isAllowed = ALLOWED_DOMAINS.some(domain => userEmail.endsWith('@' + domain));
                        
                        if (!isAllowed) {
                            alert(STATE.lang === 'zh'

                                : "Log Masuk Dihalang 🛑\n\nSila gunakan akaun Google Delima (@moe-dl.edu.my) sahaja.");
                            await signOut(auth); 
                            return; 
                        }

                        STATE.userId = user.uid;
                        STATE.parentEmail = userEmail;
                        DOM.btnLogout.classList.remove('hidden');
                        await loadUserData();
                    } else {
                        STATE.userId = null;
                        STATE.parentEmail = null;
                        DOM.btnLogout.classList.add('hidden');
                        showLoginView(true);
                    }
                });
            } catch (error) {
                console.error("Firebase 初始化失败:", error);
                alert("系统连接失败，请检查 Firebase 配置。");
            }
        }

        async function handleGoogleLogin() {
            if (!auth) {
                alert("请先在代码中填入 Firebase Config 才能启用真实登入功能！");
                return;
            }
            try {
                DOM.btnGoogleLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Google Login Error:", error);
                const t = I18N[STATE.lang];
                
                // 修复：捕获未授权域名的错误，进入模拟模式以便预览测试
                if (error.code === 'auth/unauthorized-domain') {
                    const currentDomain = window.location.hostname || "当前预览沙盒";
                    alert(STATE.lang === 'zh' 
                        ? `⚠️ 测试环境拦截 (auth/unauthorized-domain)\n\n由于当前运行环境 (${currentDomain}) 尚未加入 Firebase 白名单，Google 阻止了真实的登入。\n\n系统现已为您切换至【模拟测试模式】，让您可以继续体验选课流程！` 
                        : `⚠️ Domain Dihalang (auth/unauthorized-domain)\n\nSistem Google menghalang log masuk dari domain ujian ini.\n\nBertukar ke 【Mod Demo】 untuk membenarkan anda meneruskan ujian.`);
                    
                    // 启动模拟账号
                    STATE.userId = "demo-student-id";
                    STATE.parentEmail = "demo-student@moe-dl.edu.my";
                    DOM.btnLogout.classList.remove('hidden');
                    loadUserData();
                    return;
                }

                alert(STATE.lang === 'zh' ? "登录失败或已取消，请重试。" : "Log masuk gagal atau dibatalkan. Sila cuba lagi.");
                DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            }
        }

        function showLoginView(requiresAuth) {
            STATE.step = 0;
            DOM.viewLogin.classList.remove('hidden');
            DOM.viewWizard.classList.add('hidden');
            
            const t = I18N[STATE.lang];
            
            if (requiresAuth) {
                DOM.authSection.classList.remove('hidden');
                DOM.studentForm.classList.add('hidden');
                DOM.loginHeaderTitle.textContent = t.loginTitle;
                DOM.loginHeaderDesc.textContent = t.loginSub;
                DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            } else {
                DOM.authSection.classList.add('hidden');
                DOM.studentForm.classList.remove('hidden');
                DOM.loginHeaderTitle.textContent = t.studentProfile;
                DOM.loginHeaderDesc.textContent = t.studentProfileSub;
            }
        }

        async function loadUserData() {
            if (!db || !STATE.userId) {
                showLoginView(true);
                return;
            }
            try {
                // 修复：更改为与保存资料时一致的正确路径 'club_registrations'
                const docRef = doc(db, 'club_registrations', STATE.userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.submitted) {
                        STATE.studentInfo = data.studentInfo;
                        STATE.selections = data.selections;
                        showStep(5); // Show success immediately if already submitted
                        return;
                    }
                }
                showLoginView(false); // Show student info form
            } catch (e) {
                console.error(e);
                showLoginView(false);
            }
        }

        function toggleLanguage() {
            STATE.lang = STATE.lang === 'zh' ? 'ms' : 'zh';
            
            if (STATE.lang === 'zh') {
                DOM.langZh.className = "px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 bg-white shadow-sm text-brand-700";
                DOM.langMs.className = "px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 text-gray-500";
            } else {
                DOM.langMs.className = "px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 bg-white shadow-sm text-brand-700";
                DOM.langZh.className = "px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 text-gray-500";
            }
            
            updateTranslations();
            renderCurrentStep();
        }

        function updateTranslations() {
            const strings = I18N[STATE.lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (strings[key]) el.textContent = strings[key];
            });
            // Update inputs placeholders
            document.getElementById('input-student-name').placeholder = STATE.lang === 'zh' ? "例如: 阿里" : "Cth: Ali bin Abu";
            document.getElementById('input-student-class').placeholder = STATE.lang === 'zh' ? "例如: 1A" : "Cth: 1A";
        }

        function handleStudentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('input-student-name').value.trim();
            const cls = document.getElementById('input-student-class').value.trim();
            
            if (name && cls) {
                STATE.studentInfo = { name, cls };
                showStep(1);
            }
        }

        async function handleLogout() {
            if (auth && auth.currentUser) await signOut(auth);
            STATE.userId = null;
            STATE.parentEmail = null;
            STATE.studentInfo = null;
            STATE.selections = { step1: null, step2: null, step3: null };
            document.getElementById('student-form').reset();
            DOM.btnLogout.classList.add('hidden');
            
            const t = I18N[STATE.lang];
            DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            
            showLoginView(true);
        }

        function showStep(stepNum) {
            STATE.step = stepNum;
            
            if (stepNum === 0) {
                // Handled by showLoginView internally now based on auth state, 
                // but if called explicitly:
                showLoginView(!STATE.userId);
            } else {
                DOM.viewLogin.classList.add('hidden');
                DOM.viewWizard.classList.remove('hidden');
                updateStepperUI();
                renderCurrentStep();
            }
        }

        function updateStepperUI() {
            if (STATE.step >= 5) {
                DOM.wizardNav.classList.add('hidden');
                return; // Hide stepper on success view conceptually, but here we just leave it at 100%
            }
            
            DOM.wizardNav.classList.remove('hidden');
            
            // Progress Bar width: 1=0%, 2=33%, 3=66%, 4=100%
            const progress = (STATE.step - 1) * 33.33;
            DOM.stepperProgress.style.width = `${progress}%`;

            for (let i = 1; i <= 4; i++) {
                const circle = document.getElementById(`step-circle-${i}`);
                const label = document.getElementById(`step-label-${i}`);
                
                if (i < STATE.step) {
                    // Completed
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    label.className = "text-xs font-medium mt-2 text-brand-700";
                } else if (i === STATE.step) {
                    // Current
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-brand-100 shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.className = "text-xs font-medium mt-2 text-brand-700";
                } else {
                    // Upcoming
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.className = "text-xs font-medium mt-2 text-gray-500";
                }
            }
        }

        function renderCurrentStep() {
            const t = I18N[STATE.lang];
            
            // Hide all specific containers first
            DOM.clubsGrid.classList.add('hidden');
            DOM.summaryContainer.classList.add('hidden');
            DOM.successContainer.classList.add('hidden');
            
            // Buttons logic
            DOM.btnPrev.classList.toggle('hidden', STATE.step === 1 || STATE.step === 5);
            DOM.btnNext.classList.toggle('hidden', STATE.step === 5);
            
            if (STATE.step <= 3) {
                DOM.clubsGrid.classList.remove('hidden');
                DOM.wizardTitle.textContent = t[`step${STATE.step}Title`];
                DOM.wizardDesc.textContent = t[`step${STATE.step}Desc`];
                DOM.btnNextText.textContent = t.btnNext;
                renderClubsGrid();
            } else if (STATE.step === 4) {
                DOM.summaryContainer.classList.remove('hidden');
                DOM.wizardTitle.textContent = t.summaryTitle;
                DOM.wizardDesc.textContent = t.summaryDesc;
                DOM.btnNextText.textContent = t.btnSubmit;
                renderSummary();
                DOM.btnNext.disabled = false; // Summary can always submit
            } else if (STATE.step === 5) {
                DOM.successContainer.classList.remove('hidden');
                DOM.wizardTitle.parentElement.classList.add('hidden'); // Hide title section
                renderSuccess();
            }
        }

        function renderClubsGrid() {
            const t = I18N[STATE.lang];
            const categories = ['uniform', 'society', 'sports'];
            const currentCat = categories[STATE.step - 1];
            const stepKey = `step${STATE.step}`;
            const selectedId = STATE.selections[stepKey];
            
            const clubs = CLUBS_DATA.filter(c => c.category === currentCat);
            
            DOM.clubsGrid.innerHTML = '';
            
            clubs.forEach(club => {
                const isFull = club.enrolled >= club.capacity;
                const isChecked = selectedId === club.id;
                
                const card = document.createElement('div');
                card.className = "relative";
                
                card.innerHTML = `
                    <input type="radio" name="club-selection" id="${club.id}" value="${club.id}" 
                           class="club-card-input peer sr-only" ${isFull && !isChecked ? 'disabled' : ''} ${isChecked ? 'checked' : ''}>
                    <label for="${club.id}" class="club-card-label flex p-4 cursor-pointer bg-white border border-gray-200 rounded-xl transition-all h-full hover:border-brand-300 hover:shadow-sm">
                        <div class="flex-shrink-0 mr-4">
                            <div class="w-12 h-12 rounded-full ${club.color} flex items-center justify-center text-xl">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-gray-900 leading-tight mb-1">${club[`name_${STATE.lang}`]}</h3>
                                <div class="check-icon opacity-0 transform scale-50 transition-all text-brand-600 bg-brand-100 rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0 ml-2 shadow-sm">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${club[`desc_${STATE.lang}`]}</p>
                            
                            <div class="inline-flex items-center px-2 py-1 rounded text-xs font-semibold ${isFull ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-gray-100 text-gray-600'}">
                                <i class="fa-solid fa-user-group mr-1.5"></i>
                                ${isFull ? t.full : `${club.enrolled}/${club.capacity} ${t.slots}`}
                            </div>
                        </div>
                    </label>
                `;
                
                DOM.clubsGrid.appendChild(card);
            });

            // Listen for changes to enable/disable Next button
            const inputs = document.querySelectorAll('input[name="club-selection"]');
            
            const checkNextState = () => {
                const checked = document.querySelector('input[name="club-selection"]:checked');
                DOM.btnNext.disabled = !checked;
                if(checked) STATE.selections[stepKey] = checked.value;
            };
            
            inputs.forEach(input => input.addEventListener('change', checkNextState));
            checkNextState(); // Initial check
        }

        function renderSummary() {
            const t = I18N[STATE.lang];
            DOM.summaryList.innerHTML = '';
            
            const cats = ['uniform', 'society', 'sports'];
            
            for (let i = 1; i <= 3; i++) {
                const clubId = STATE.selections[`step${i}`];
                const club = CLUBS_DATA.find(c => c.id === clubId);
                const stepCatName = t[cats[i-1]];
                
                if (club) {
                    DOM.summaryList.innerHTML += `
                        <div class="flex items-center p-4 bg-white border border-gray-100 rounded-xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)]">
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold mr-4 flex-shrink-0 shadow-inner">
                                ${i}
                            </div>
                            <div class="flex-grow">
                                <p class="text-xs text-gray-500 mb-0.5">${stepCatName}</p>
                                <h4 class="font-bold text-gray-900">${club[`name_${STATE.lang}`]}</h4>
                            </div>
                            <div class="text-2xl opacity-20 ml-2">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        function renderSuccess() {
             const t = I18N[STATE.lang];
             const details = document.getElementById('success-details');
             
             // Set email to be sent to
             DOM.successEmail.textContent = STATE.parentEmail || 'your-email@example.com';
             
             details.innerHTML = `
                <div class="flex justify-between py-2 border-b border-gray-200">
                    <span class="text-gray-500">${t.studentName}</span>
                    <span class="font-medium text-gray-900">${STATE.studentInfo.name}</span>
                </div>
                <div class="flex justify-between py-2 mb-2 border-b border-gray-200">
                    <span class="text-gray-500">Kelas / 班级</span>
                    <span class="font-medium text-gray-900">${STATE.studentInfo.cls}</span>
                </div>
                <div class="pt-2">
                    <span class="text-xs text-brand-600 font-bold tracking-wider uppercase mb-2 block">Selections / 已选</span>
                    ${[1,2,3].map(i => {
                        const club = CLUBS_DATA.find(c => c.id === STATE.selections[`step${i}`]);
                        return `<div class="text-sm font-medium text-gray-800 py-1 flex items-center gap-2"><i class="fa-solid fa-check text-green-500 text-xs"></i> ${club ? club[`name_${STATE.lang}`] : ''}</div>`;
                    }).join('')}
                </div>
             `;
        }

        async function submitData() {
            DOM.btnNext.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            DOM.btnNext.disabled = true;
            DOM.btnPrev.disabled = true;
            
            try {
                if (db && STATE.userId) {
                    // 如果是模拟测试账号，跳过真实的资料库写入以避免报错
                    if (STATE.userId === 'demo-student-id') {
                        console.log("[Demo Mode] 模拟数据保存成功，跳过真实的 Firestore 写入。");
                    } else {
                        const docRef = doc(db, 'club_registrations', STATE.userId); // 改为统一存放在 club_registrations 集合中
                        await setDoc(docRef, {
                            studentInfo: STATE.studentInfo,
                            parentEmail: STATE.parentEmail,
                            selections: STATE.selections,
                            submitted: true,
                            timestamp: new Date().toISOString()
                        });
                        console.log(`[Database] Registration report successfully saved for ${STATE.parentEmail}`);
                    }
                }

                // ==============================================================
                // EMAILJS: 发送真实邮件逻辑
                // ==============================================================
                try {
                    // ⚠️ 注意：您需要在这里填入您在 EmailJS 网站上获得的真实 ID
                    const EMAILJS_SERVICE_ID = 'service_bwzihgq';   // 例如: 'service_xyz123'
                    const EMAILJS_TEMPLATE_ID = 'template_z1h7bmb'; // 例如: 'template_abc456'
                    const EMAILJS_PUBLIC_KEY = 'ADioVrvLS4IlQK0J2';   // 例如: 'pubkey_qwertyuiop'
                    
                    if (EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY') {
                        emailjs.init(EMAILJS_PUBLIC_KEY);
                        
                        // 获取所选社团的具体名称
                        const club1 = CLUBS_DATA.find(c => c.id === STATE.selections.step1);
                        const club2 = CLUBS_DATA.find(c => c.id === STATE.selections.step2);
                        const club3 = CLUBS_DATA.find(c => c.id === STATE.selections.step3);

                        // 准备传递给邮件模板的参数
                        const templateParams = {
                            to_email: STATE.parentEmail,
                            student_name: STATE.studentInfo.name,
                            student_class: STATE.studentInfo.cls,
                            uniform_club: club1 ? club1[`name_${STATE.lang}`] : '',
                            society_club: club2 ? club2[`name_${STATE.lang}`] : '',
                            sports_club: club3 ? club3[`name_${STATE.lang}`] : ''
                        };

                        // 触发发送邮件
                        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                        console.log("EmailJS: 真实邮件发送成功！");
                    } else {
                        console.warn("EmailJS: 未配置 Key，已跳过发送真实电邮。请在代码中填写您的 ID。");
                    }
                } catch (emailErr) {
                    console.error("EmailJS 发送失败:", emailErr);
                    // 邮件发送失败不会阻止页面显示成功信息，仅在控制台报错
                }
                // ==============================================================

                showStep(5); // Success view
            } catch (err) {
                console.error(err);
                alert("Error saving data. Please try again.");
                const t = I18N[STATE.lang];
                DOM.btnNext.innerHTML = `<span id="btn-next-text">${t.btnSubmit}</span> <i class="fa-solid fa-arrow-right"></i>`;
                DOM.btnNext.disabled = false;
                DOM.btnPrev.disabled = false;
            }
        }

        // Event Listeners
        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);
        DOM.btnGoogleLogin.addEventListener('click', handleGoogleLogin);
        DOM.studentForm.addEventListener('submit', handleStudentSubmit);
        DOM.btnLogout.addEventListener('click', handleLogout);
        
        DOM.btnPrev.addEventListener('click', () => {
            if (STATE.step > 1) showStep(STATE.step - 1);
        });
        
        DOM.btnNext.addEventListener('click', () => {
            if (STATE.step < 4) {
                // Next step logic handles validation via disabled button
                showStep(STATE.step + 1);
            } else if (STATE.step === 4) {
                // Submit
                submitData();
            }
        });

        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="zh">
<head>

    <script>
        tailwind.config = {
            theme: {
                extend: {

                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],

                    }
                }

        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; }

            filter: grayscale(100%);

</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="font-bold text-xl text-gray-900 tracking-tight" data-i18n="appTitle">学校课外活动</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="flex items-center bg-gray-100 rounded-full p-1 cursor-pointer select-none" id="lang-toggle-btn">
                        <div id="lang-zh" class="px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 bg-white shadow-sm text-brand-700">华文</div>
                        <div id="lang-ms" class="px-3 py-1 rounded-full text-sm font-medium transition-all duration-300 text-gray-500">BM</div>
                    </div>
                    <button id="btn-logout" class="hidden text-gray-500 hover:text-red-600 transition-colors ml-2" title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative">
        
        <section id="view-login" class="fade-in max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mt-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900" id="login-header-title" data-i18n="loginTitle">家长登录</h1>
                <p class="text-gray-500 mt-2 text-sm" id="login-header-desc" data-i18n="loginSub">请使用 Google 账号登录以继续</p>
            </div>

            <!-- Google Auth Section -->
            <div id="auth-section" class="flex flex-col items-center">
                <button id="btn-google-login" type="button" class="w-full py-3 px-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-xl font-bold shadow-sm transition-all flex items-center justify-center gap-3">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                    <span data-i18n="googleLogin">使用 Google 账号登录</span>
                </button>

        const ALLOWED_DOMAINS = ['moe-dl.edu.my', 'gmail.com'];

        async function initFirebase() {
            try {
                // 检查是否已经填入了真实的 API Key
                if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                    console.warn("尚未配置 Firebase Config，请先配置以启用真实登入功能。");
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                googleProvider = new GoogleAuthProvider();
                
                // 强制每次登入时选择账号 (避免浏览器记住旧账号导致无法切换)
                googleProvider.setCustomParameters({ prompt: 'select_account' });

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const userEmail = user.email || '';
                        const isAllowed = ALLOWED_DOMAINS.some(domain => userEmail.endsWith('@' + domain));
                        
                        if (!isAllowed) {
                            alert(STATE.lang === 'zh' 
                                ? "登入拦截 🛑\n\n为了防止重复填写，系统仅允许使用学生专属的 Google Delima 账号 (@moe-dl.edu.my) 进行登入。\n请使用正确的账号重新登入。" 
                                : "Log Masuk Dihalang 🛑\n\nSila gunakan akaun Google Delima (@moe-dl.edu.my) sahaja.");
                            await signOut(auth); 
                            return; 
                        }

                        STATE.userId = user.uid;
                        STATE.parentEmail = userEmail;
                        DOM.btnLogout.classList.remove('hidden');
                        await loadUserData();
                    } else {
                        STATE.userId = null;
                        STATE.parentEmail = null;
                        DOM.btnLogout.classList.add('hidden');
                        showLoginView(true);
                    }
                });
            } catch (error) {
                console.error("Firebase 初始化失败:", error);
                alert("系统连接失败，请检查 Firebase 配置。");
            }
        }

        async function handleGoogleLogin() {
            if (!auth) {
                alert("请先在代码中填入 Firebase Config 才能启用真实登入功能！");
                return;
            }
            try {
                DOM.btnGoogleLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Google Login Error:", error);
                const t = I18N[STATE.lang];
                
                // 修复：捕获未授权域名的错误，进入模拟模式以便预览测试
                if (error.code === 'auth/unauthorized-domain') {
                    const currentDomain = window.location.hostname || "当前预览沙盒";
                    alert(STATE.lang === 'zh' 
                        ? `⚠️ 测试环境拦截 (auth/unauthorized-domain)\n\n由于当前运行环境 (${currentDomain}) 尚未加入 Firebase 白名单，Google 阻止了真实的登入。\n\n系统现已为您切换至【模拟测试模式】，让您可以继续体验选课流程！` 
                        : `⚠️ Domain Dihalang (auth/unauthorized-domain)\n\nSistem Google menghalang log masuk dari domain ujian ini.\n\nBertukar ke 【Mod Demo】 untuk membenarkan anda meneruskan ujian.`);
                    
                    // 启动模拟账号
                    STATE.userId = "demo-student-id";
                    STATE.parentEmail = "demo-student@moe-dl.edu.my";
                    DOM.btnLogout.classList.remove('hidden');
                    loadUserData();
                    return;
                }

                alert(STATE.lang === 'zh' ? "登录失败或已取消，请重试。" : "Log masuk gagal atau dibatalkan. Sila cuba lagi.");
                DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            }
        }

        function showLoginView(requiresAuth) {
            STATE.step = 0;
            DOM.viewLogin.classList.remove('hidden');
            DOM.viewWizard.classList.add('hidden');
            
            const t = I18N[STATE.lang];
            
            if (requiresAuth) {
                DOM.authSection.classList.remove('hidden');
                DOM.studentForm.classList.add('hidden');
                DOM.loginHeaderTitle.textContent = t.loginTitle;
                DOM.loginHeaderDesc.textContent = t.loginSub;
                DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            } else {
                DOM.authSection.classList.add('hidden');
                DOM.studentForm.classList.remove('hidden');
                DOM.loginHeaderTitle.textContent = t.studentProfile;
                DOM.loginHeaderDesc.textContent = t.studentProfileSub;
            }
        }

        async function loadUserData() {
            if (!db || !STATE.userId) {
                showLoginView(true);
                return;
            }
            try {
                // 修复：更改为与保存资料时一致的正确路径 'club_registrations'
                const docRef = doc(db, 'club_registrations', STATE.userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.submitted) {
                        STATE.studentInfo = data.studentInfo;
                        STATE.selections = data.selections;
                        showStep(5); // Show success immediately if already submitted
                        return;
                    }
                }
                showLoginView(false); // Show student info form
            } catch (e) {
                console.error(e);
                showLoginView(false);
            }
        }

            updateTranslations();
            renderCurrentStep();

        function updateTranslations() {
            const strings = I18N[STATE.lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (strings[key]) el.textContent = strings[key];
            });
            // Update inputs placeholders
            document.getElementById('input-student-name').placeholder = STATE.lang === 'zh' ? "例如: 阿里" : "Cth: Ali bin Abu";
            document.getElementById('input-student-class').placeholder = STATE.lang === 'zh' ? "例如: 1A" : "Cth: 1A";
        }

        function handleStudentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('input-student-name').value.trim();
            const cls = document.getElementById('input-student-class').value.trim();
            
            if (name && cls) {
                STATE.studentInfo = { name, cls };
                showStep(1);
            }
        }

        async function handleLogout() {
            if (auth && auth.currentUser) await signOut(auth);
            STATE.userId = null;
            STATE.parentEmail = null;
            STATE.studentInfo = null;
            STATE.selections = { step1: null, step2: null, step3: null };
            document.getElementById('student-form').reset();
            DOM.btnLogout.classList.add('hidden');
            
            const t = I18N[STATE.lang];
            DOM.btnGoogleLogin.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span data-i18n="googleLogin">${t.googleLogin}</span>`;
            
            showLoginView(true);
        }

        function showStep(stepNum) {
            STATE.step = stepNum;
            
            if (stepNum === 0) {
                // Handled by showLoginView internally now based on auth state, 
                // but if called explicitly:
                showLoginView(!STATE.userId);
            } else {
                DOM.viewLogin.classList.add('hidden');
                DOM.viewWizard.classList.remove('hidden');
                updateStepperUI();
                renderCurrentStep();
            }
        }

        function updateStepperUI() {
            if (STATE.step >= 5) {
                DOM.wizardNav.classList.add('hidden');
                return; // Hide stepper on success view conceptually, but here we just leave it at 100%
            }
            
            DOM.wizardNav.classList.remove('hidden');
            
            // Progress Bar width: 1=0%, 2=33%, 3=66%, 4=100%
            const progress = (STATE.step - 1) * 33.33;
            DOM.stepperProgress.style.width = `${progress}%`;

            for (let i = 1; i <= 4; i++) {
                const circle = document.getElementById(`step-circle-${i}`);
                const label = document.getElementById(`step-label-${i}`);
                
                if (i < STATE.step) {
                    // Completed
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    label.className = "text-xs font-medium mt-2 text-brand-700";
                } else if (i === STATE.step) {
                    // Current
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-brand-100 shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.className = "text-xs font-medium mt-2 text-brand-700";
                } else {
                    // Upcoming
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.className = "text-xs font-medium mt-2 text-gray-500";
                }
            }
        }

        function renderCurrentStep() {
            const t = I18N[STATE.lang];
            
            // Hide all specific containers first
            DOM.clubsGrid.classList.add('hidden');
            DOM.summaryContainer.classList.add('hidden');
            DOM.successContainer.classList.add('hidden');
            
            // Buttons logic
            DOM.btnPrev.classList.toggle('hidden', STATE.step === 1 || STATE.step === 5);
            DOM.btnNext.classList.toggle('hidden', STATE.step === 5);
            
            if (STATE.step <= 3) {
                DOM.clubsGrid.classList.remove('hidden');
                DOM.wizardTitle.textContent = t[`step${STATE.step}Title`];
                DOM.wizardDesc.textContent = t[`step${STATE.step}Desc`];
                DOM.btnNextText.textContent = t.btnNext;
                renderClubsGrid();
            } else if (STATE.step === 4) {
                DOM.summaryContainer.classList.remove('hidden');
                DOM.wizardTitle.textContent = t.summaryTitle;
                DOM.wizardDesc.textContent = t.summaryDesc;
                DOM.btnNextText.textContent = t.btnSubmit;
                renderSummary();
                DOM.btnNext.disabled = false; // Summary can always submit
            } else if (STATE.step === 5) {
                DOM.successContainer.classList.remove('hidden');
                DOM.wizardTitle.parentElement.classList.add('hidden'); // Hide title section
                renderSuccess();
            }
        }

        function renderClubsGrid() {
            const t = I18N[STATE.lang];
            const categories = ['uniform', 'society', 'sports'];
            const currentCat = categories[STATE.step - 1];
            const stepKey = `step${STATE.step}`;
            const selectedId = STATE.selections[stepKey];
            
            const clubs = CLUBS_DATA.filter(c => c.category === currentCat);
            
            DOM.clubsGrid.innerHTML = '';
            
            clubs.forEach(club => {
                const isFull = club.enrolled >= club.capacity;
                const isChecked = selectedId === club.id;
                
                const card = document.createElement('div');
                card.className = "relative";
                
                card.innerHTML = `
                    <input type="radio" name="club-selection" id="${club.id}" value="${club.id}" 
                           class="club-card-input peer sr-only" ${isFull && !isChecked ? 'disabled' : ''} ${isChecked ? 'checked' : ''}>
                    <label for="${club.id}" class="club-card-label flex p-4 cursor-pointer bg-white border border-gray-200 rounded-xl transition-all h-full hover:border-brand-300 hover:shadow-sm">
                        <div class="flex-shrink-0 mr-4">
                            <div class="w-12 h-12 rounded-full ${club.color} flex items-center justify-center text-xl">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-gray-900 leading-tight mb-1">${club[`name_${STATE.lang}`]}</h3>
                                <div class="check-icon opacity-0 transform scale-50 transition-all text-brand-600 bg-brand-100 rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0 ml-2 shadow-sm">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${club[`desc_${STATE.lang}`]}</p>
                            
                            <div class="inline-flex items-center px-2 py-1 rounded text-xs font-semibold ${isFull ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-gray-100 text-gray-600'}">
                                <i class="fa-solid fa-user-group mr-1.5"></i>
                                ${isFull ? t.full : `${club.enrolled}/${club.capacity} ${t.slots}`}
                            </div>
                        </div>
                    </label>
                `;
                
                DOM.clubsGrid.appendChild(card);
            });

            // Listen for changes to enable/disable Next button
            const inputs = document.querySelectorAll('input[name="club-selection"]');
            
            const checkNextState = () => {
                const checked = document.querySelector('input[name="club-selection"]:checked');
                DOM.btnNext.disabled = !checked;
                if(checked) STATE.selections[stepKey] = checked.value;
            };
            
            inputs.forEach(input => input.addEventListener('change', checkNextState));
            checkNextState(); // Initial check
        }

        function renderSummary() {
            const t = I18N[STATE.lang];
            DOM.summaryList.innerHTML = '';
            
            const cats = ['uniform', 'society', 'sports'];
            
            for (let i = 1; i <= 3; i++) {
                const clubId = STATE.selections[`step${i}`];
                const club = CLUBS_DATA.find(c => c.id === clubId);
                const stepCatName = t[cats[i-1]];
                
                if (club) {
                    DOM.summaryList.innerHTML += `
                        <div class="flex items-center p-4 bg-white border border-gray-100 rounded-xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)]">
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold mr-4 flex-shrink-0 shadow-inner">
                                ${i}
                            </div>
                            <div class="flex-grow">
                                <p class="text-xs text-gray-500 mb-0.5">${stepCatName}</p>
                                <h4 class="font-bold text-gray-900">${club[`name_${STATE.lang}`]}</h4>
                            </div>
                            <div class="text-2xl opacity-20 ml-2">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        function renderSuccess() {
             const t = I18N[STATE.lang];
             const details = document.getElementById('success-details');
             
             // Set email to be sent to
             DOM.successEmail.textContent = STATE.parentEmail || 'your-email@example.com';
             
             details.innerHTML = `
                <div class="flex justify-between py-2 border-b border-gray-200">
                    <span class="text-gray-500">${t.studentName}</span>
                    <span class="font-medium text-gray-900">${STATE.studentInfo.name}</span>
                </div>
                <div class="flex justify-between py-2 mb-2 border-b border-gray-200">
                    <span class="text-gray-500">Kelas / 班级</span>
                    <span class="font-medium text-gray-900">${STATE.studentInfo.cls}</span>
                </div>
                <div class="pt-2">
                    <span class="text-xs text-brand-600 font-bold tracking-wider uppercase mb-2 block">Selections / 已选</span>
                    ${[1,2,3].map(i => {
                        const club = CLUBS_DATA.find(c => c.id === STATE.selections[`step${i}`]);
                        return `<div class="text-sm font-medium text-gray-800 py-1 flex items-center gap-2"><i class="fa-solid fa-check text-green-500 text-xs"></i> ${club ? club[`name_${STATE.lang}`] : ''}</div>`;
                    }).join('')}
                </div>
             `;
        }

        async function submitData() {
            DOM.btnNext.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            DOM.btnNext.disabled = true;
            DOM.btnPrev.disabled = true;
            
            try {
                if (db && STATE.userId) {
                    // 如果是模拟测试账号，跳过真实的资料库写入以避免报错
                    if (STATE.userId === 'demo-student-id') {
                        console.log("[Demo Mode] 模拟数据保存成功，跳过真实的 Firestore 写入。");
                    } else {
                        const docRef = doc(db, 'club_registrations', STATE.userId); // 改为统一存放在 club_registrations 集合中
                        await setDoc(docRef, {
                            studentInfo: STATE.studentInfo,
                            parentEmail: STATE.parentEmail,
                            selections: STATE.selections,
                            submitted: true,
                            timestamp: new Date().toISOString()
                        });
                        console.log(`[Database] Registration report successfully saved for ${STATE.parentEmail}`);
                    }
                }

                // ==============================================================
                // EMAILJS: 发送真实邮件逻辑
                // ==============================================================
                try {
                    // ⚠️ 注意：您需要在这里填入您在 EmailJS 网站上获得的真实 ID
                    const EMAILJS_SERVICE_ID = 'service_bwzihgq';   // 例如: 'service_xyz123'
                    const EMAILJS_TEMPLATE_ID = 'template_z1h7bmb'; // 例如: 'template_abc456'
                    const EMAILJS_PUBLIC_KEY = 'ADioVrvLS4IlQK0J2';   // 例如: 'pubkey_qwertyuiop'
                    
                    if (EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY') {
                        emailjs.init(EMAILJS_PUBLIC_KEY);
                        
                        // 获取所选社团的具体名称
                        const club1 = CLUBS_DATA.find(c => c.id === STATE.selections.step1);
                        const club2 = CLUBS_DATA.find(c => c.id === STATE.selections.step2);
                        const club3 = CLUBS_DATA.find(c => c.id === STATE.selections.step3);

                        // 准备传递给邮件模板的参数
                        const templateParams = {
                            to_email: STATE.parentEmail,
                            student_name: STATE.studentInfo.name,
                            student_class: STATE.studentInfo.cls,
                            uniform_club: club1 ? club1[`name_${STATE.lang}`] : '',
                            society_club: club2 ? club2[`name_${STATE.lang}`] : '',
                            sports_club: club3 ? club3[`name_${STATE.lang}`] : ''
                        };

                        // 触发发送邮件
                        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                        console.log("EmailJS: 真实邮件发送成功！");
                    } else {
                        console.warn("EmailJS: 未配置 Key，已跳过发送真实电邮。请在代码中填写您的 ID。");
                    }
                } catch (emailErr) {
                    console.error("EmailJS 发送失败:", emailErr);
                    // 邮件发送失败不会阻止页面显示成功信息，仅在控制台报错
                }
                // ==============================================================

                showStep(5); // Success view
            } catch (err) {
                console.error(err);
                alert("Error saving data. Please try again.");
                const t = I18N[STATE.lang];
                DOM.btnNext.innerHTML = `<span id="btn-next-text">${t.btnSubmit}</span> <i class="fa-solid fa-arrow-right"></i>`;
                DOM.btnNext.disabled = false;
                DOM.btnPrev.disabled = false;
            }
        }

        // Event Listeners
        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);
        DOM.btnGoogleLogin.addEventListener('click', handleGoogleLogin);
        DOM.studentForm.addEventListener('submit', handleStudentSubmit);
        DOM.btnLogout.addEventListener('click', handleLogout);
        
        DOM.btnPrev.addEventListener('click', () => {
            if (STATE.step > 1) showStep(STATE.step - 1);
        });
        
        DOM.btnNext.addEventListener('click', () => {
            if (STATE.step < 4) {
                // Next step logic handles validation via disabled button
                showStep(STATE.step + 1);
            } else if (STATE.step === 4) {
                // Submit
                submitData();
            }
        });

        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
</body>
</html>
