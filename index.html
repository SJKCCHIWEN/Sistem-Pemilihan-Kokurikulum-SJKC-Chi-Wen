            selections: { step1: null, step2: null, step3: null },
            userId: null,
            parentEmail: null
        };

        const DOM = {
            viewLogin: document.getElementById('view-login'),
            viewWizard: document.getElementById('view-wizard'),
            authSection: document.getElementById('auth-section'),
            btnGoogleLogin: document.getElementById('btn-google-login'),
            studentForm: document.getElementById('student-form'),
            loginHeaderTitle: document.getElementById('login-header-title'),
            loginHeaderDesc: document.getElementById('login-header-desc'),
            btnLogout: document.getElementById('btn-logout'),
            stepperProgress: document.getElementById('stepper-progress'),
            wizardTitle: document.getElementById('wizard-step-title'),
            wizardDesc: document.getElementById('wizard-step-desc'),
            clubsGrid: document.getElementById('clubs-grid'),
            summaryContainer: document.getElementById('summary-container'),
            summaryList: document.getElementById('summary-list'),
            successContainer: document.getElementById('success-container'),
            wizardNav: document.getElementById('wizard-nav'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnNextText: document.getElementById('btn-next-text')
        };

        let db, auth, googleProvider;
        const ALLOWED_DOMAINS = ['moe-dl.edu.my', 'gmail.com']; // 上线时可以把 gmail 删除

        function setupStaticText() {
            const t = I18N.zh;
            document.getElementById('google-login-text').innerHTML = t.googleLogin;
            document.getElementById('label-student-name').innerHTML = t.studentName;
            document.getElementById('label-student-class').innerHTML = t.studentClass;
            document.getElementById('label-login-btn').innerHTML = t.loginBtn;
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                googleProvider = new GoogleAuthProvider();
                googleProvider.setCustomParameters({ prompt: 'select_account' });

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const userEmail = user.email || '';
                        const isAllowed = ALLOWED_DOMAINS.some(domain => userEmail.endsWith('@' + domain));
                        
                        if (!isAllowed) {
                            alert("登入拦截 🛑\n\n为了防止重复填写，系统仅允许使用学生专属的 Google Delima 账号 (@moe-dl.edu.my) 进行登入。");
                            await signOut(auth); 
                            return; 
                        }

                        STATE.userId = user.uid;
                        STATE.parentEmail = userEmail;
                        DOM.btnLogout.classList.remove('hidden');
                        await loadUserData();
                    } else {
                        STATE.userId = null;
                        STATE.parentEmail = null;
                        DOM.btnLogout.classList.add('hidden');
                        showLoginView(true);
                    }
                });
            } catch (error) {
                console.error("Firebase 初始化失败:", error);
            }
        }

        async function handleGoogleLogin() {
            if (!auth) return;
            try {
                DOM.btnGoogleLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Google Login Error:", error);
                if (error.code === 'auth/unauthorized-domain' || error.code === 'auth/operation-not-allowed') {
                    alert(`⚠️ 登入被拦截 (${error.code})\n\n请确认您已经在 Firebase 后台加入了此网页的域名，并开启了 Google 登入功能。\n\n系统现为您切换至【模拟测试模式】。`);
                    STATE.userId = "demo-student-id";
                    STATE.parentEmail = "demo-student@moe-dl.edu.my";
                    DOM.btnLogout.classList.remove('hidden');
                    loadUserData();
                    return;
                }
                alert(`登录失败或已取消。`);
                setupStaticText();
            }
        }

        async function fetchClubCapacities() {
            if (!db || STATE.userId === 'demo-student-id') return;
            try {
                console.log("正在从 Firebase 同步真实报名人数...");
                const snapshot = await getDocs(collection(db, 'club_registrations'));
                
                // 初始化计数器
                const counts = {};
                CLUBS_DATA.forEach(c => counts[c.id] = 0);

                // 统计每个社团被选择的次数
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.selections) {
                        if (data.selections.step1) counts[data.selections.step1] = (counts[data.selections.step1] || 0) + 1;
                        if (data.selections.step2) counts[data.selections.step2] = (counts[data.selections.step2] || 0) + 1;
                        if (data.selections.step3) counts[data.selections.step3] = (counts[data.selections.step3] || 0) + 1;
                    }
                });

                // 更新本地数据中的 enrolled 数量
                CLUBS_DATA.forEach(c => {
                    c.enrolled = counts[c.id] || 0;
                });
                console.log("人数同步完成！");
            } catch (e) {
                console.error("同步人数失败:", e);
            }
        }

        async function loadUserData() {
            if (!db || !STATE.userId) {
                showLoginView(true);
                return;
            }
            try {
                const docRef = doc(db, 'club_registrations', STATE.userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.submitted) {
                        STATE.studentInfo = data.studentInfo;
                        STATE.selections = data.selections;
                        showStep(5);
                        return;
                    }
                }
                showLoginView(false);
            } catch (e) {
                console.error(e);
                showLoginView(false);
            }
        }

        function showLoginView(requiresAuth) {
            STATE.step = 0;
            DOM.viewLogin.classList.remove('hidden');
            DOM.viewWizard.classList.add('hidden');
            
            const t = I18N.zh;
            
            if (requiresAuth) {
                DOM.authSection.classList.remove('hidden');
                DOM.studentForm.classList.add('hidden');
                DOM.loginHeaderTitle.innerHTML = t.loginTitle;
                DOM.loginHeaderDesc.innerHTML = t.loginSub;
                setupStaticText();
            } else {
                DOM.authSection.classList.add('hidden');
                DOM.studentForm.classList.remove('hidden');
                DOM.loginHeaderTitle.innerHTML = t.studentProfile;
                DOM.loginHeaderDesc.innerHTML = t.studentProfileSub;
            }
        }

        async function handleStudentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('input-student-name').value.trim();
            const cls = document.getElementById('input-student-class').value.trim();
            if (name && cls) {
                STATE.studentInfo = { name, cls };
                
                // 重点：在进入选课页面前，瞬间算好所有社团的最新人数
                const submitBtn = DOM.studentForm.querySelector('button[type="submit"]');
                const originalContent = submitBtn.innerHTML;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在读取最新名额...`;
                submitBtn.disabled = true;

                await fetchClubCapacities();

                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
                showStep(1);
            }
        }

        async function handleLogout() {
            if (auth && auth.currentUser) await signOut(auth);
            STATE.userId = null;
            STATE.parentEmail = null;
            STATE.studentInfo = null;
            STATE.selections = { step1: null, step2: null, step3: null };
            document.getElementById('student-form').reset();
            DOM.btnLogout.classList.add('hidden');
            setupStaticText();
            showLoginView(true);
        }

        function showStep(stepNum) {
            STATE.step = stepNum;
            if (stepNum === 0) {
                showLoginView(!STATE.userId);
            } else {
                DOM.viewLogin.classList.add('hidden');
                DOM.viewWizard.classList.remove('hidden');
                updateStepperUI();
                renderCurrentStep();
            }
        }

        function updateStepperUI() {
            if (STATE.step >= 5) {
                DOM.wizardNav.classList.add('hidden');
                return;
            }
            DOM.wizardNav.classList.remove('hidden');
            const progress = (STATE.step - 1) * 33.33;
            DOM.stepperProgress.style.width = `${progress}%`;

            for (let i = 1; i <= 4; i++) {
                const circle = document.getElementById(`step-circle-${i}`);
                const label = document.getElementById(`step-label-${i}`);
                
                if (i < STATE.step) {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    label.classList.replace('text-gray-500', 'text-brand-700');
                } else if (i === STATE.step) {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-brand-600 text-white ring-4 ring-brand-100 shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.classList.replace('text-gray-500', 'text-brand-700');
                } else {
                    circle.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 ring-4 ring-white shadow-sm transition-colors";
                    circle.innerHTML = i === 4 ? `<i class="fa-solid fa-check"></i>` : i;
                    label.classList.replace('text-brand-700', 'text-gray-500');
                }
            }
        }

        function renderCurrentStep() {
            const t = I18N.zh;
            
            DOM.clubsGrid.classList.add('hidden');
            DOM.summaryContainer.classList.add('hidden');
            DOM.successContainer.classList.add('hidden');
            
            DOM.btnPrev.classList.toggle('hidden', STATE.step === 1 || STATE.step === 5);
            DOM.btnNext.classList.toggle('hidden', STATE.step === 5);
            
            if (STATE.step <= 3) {
                DOM.clubsGrid.classList.remove('hidden');
                DOM.wizardTitle.innerHTML = t[`step${STATE.step}Title`];
                DOM.wizardDesc.innerHTML = t[`step${STATE.step}Desc`];
                DOM.btnNextText.innerHTML = t.btnNext;
                renderClubsGrid();
            } else if (STATE.step === 4) {
                DOM.summaryContainer.classList.remove('hidden');
                DOM.wizardTitle.innerHTML = t.summaryTitle;
                DOM.wizardDesc.innerHTML = t.summaryDesc;
                DOM.btnNextText.innerHTML = t.btnSubmit;
                renderSummary();
                DOM.btnNext.disabled = false;
            } else if (STATE.step === 5) {
                DOM.successContainer.classList.remove('hidden');
                DOM.wizardTitle.parentElement.classList.add('hidden');
                renderSuccess();
            }
        }

        function renderClubsGrid() {
            const t = I18N.zh;
            const categories = ['uniform', 'society', 'sports'];
            const currentCat = categories[STATE.step - 1];
            const stepKey = `step${STATE.step}`;
            const selectedId = STATE.selections[stepKey];
            const clubs = CLUBS_DATA.filter(c => c.category === currentCat);
            
            DOM.clubsGrid.innerHTML = '';
            
            clubs.forEach(club => {
                const isFull = club.enrolled >= club.capacity;
                const isChecked = selectedId === club.id;
                const card = document.createElement('div');
                card.className = "relative";
                
                card.innerHTML = `
                    <input type="radio" name="club-selection" id="${club.id}" value="${club.id}" 
                           class="club-card-input peer sr-only" ${isFull && !isChecked ? 'disabled' : ''} ${isChecked ? 'checked' : ''}>
                    <label for="${club.id}" class="club-card-label flex p-4 cursor-pointer bg-white border border-gray-200 rounded-xl transition-all h-full hover:border-brand-300 hover:shadow-sm">
                        <div class="flex-shrink-0 mr-4">
                            <div class="w-12 h-12 rounded-full ${club.color} flex items-center justify-center text-xl">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-gray-900 leading-tight">${club.name_zh}</h3>
                                    <div class="text-[11px] text-gray-500 font-medium mb-1">${club.name_ms}</div>
                                </div>
                                <div class="check-icon opacity-0 transform scale-50 transition-all text-brand-600 bg-brand-100 rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0 ml-2 shadow-sm">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </div>
                            </div>
                            
                            ${club.desc_zh ? `<p class="text-xs text-gray-600 mt-2">${club.desc_zh}</p>` : ''}
                            ${club.desc_ms ? `<p class="text-[10px] text-gray-400 mb-3 italic">${club.desc_ms}</p>` : ''}
                            
                            <div class="inline-flex items-center px-2 py-1 rounded text-xs font-semibold mt-2 ${isFull ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-gray-100 text-gray-600'}">
                                <i class="fa-solid fa-user-group mr-1.5"></i>
                                ${isFull ? t.full : `${club.enrolled}/${club.capacity} ${t.slots}`}
                            </div>
                        </div>
                    </label>
                `;
                DOM.clubsGrid.appendChild(card);
            });

            const inputs = document.querySelectorAll('input[name="club-selection"]');
            const checkNextState = () => {
                const checked = document.querySelector('input[name="club-selection"]:checked');
                DOM.btnNext.disabled = !checked;
                if(checked) STATE.selections[stepKey] = checked.value;
            };
            inputs.forEach(input => input.addEventListener('change', checkNextState));
            checkNextState();
        }

        function renderSummary() {
            const t = I18N.zh;
            DOM.summaryList.innerHTML = '';
            const cats = ['uniform', 'society', 'sports'];
            
            for (let i = 1; i <= 3; i++) {
                const clubId = STATE.selections[`step${i}`];
                const club = CLUBS_DATA.find(c => c.id === clubId);
                const stepCatName = t[cats[i-1]];
                
                if (club) {
                    DOM.summaryList.innerHTML += `
                        <div class="flex items-center p-4 bg-white border border-gray-100 rounded-xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)]">
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold mr-4 flex-shrink-0 shadow-inner">
                                ${i}
                            </div>
                            <div class="flex-grow">
                                <p class="text-[10px] text-gray-500 mb-1">${stepCatName}</p>
                                <h4 class="font-bold text-gray-900 leading-tight">${club.name_zh}</h4>
                                <h5 class="text-xs text-gray-500">${club.name_ms}</h5>
                            </div>
                            <div class="text-2xl opacity-20 ml-2">
                                <i class="fa-solid ${club.icon}"></i>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        function renderSuccess() {
            const t = I18N.zh;
            const details = document.getElementById('success-details');
            
            details.innerHTML = `
                <div class="flex justify-between py-2 border-b border-gray-200">
                    <span class="text-gray-500">${t.studentName}</span>
                    <span class="font-medium text-gray-900 uppercase">${STATE.studentInfo.name}</span>
                </div>
                <div class="flex justify-between py-2 mb-2 border-b border-gray-200">
                    <span class="text-gray-500">${t.studentClass}</span>
                    <span class="font-medium text-gray-900 uppercase">${STATE.studentInfo.cls}</span>
                </div>
                <div class="pt-2">
                    <span class="text-xs text-brand-600 font-bold tracking-wider uppercase mb-2 block">Selections / 已选</span>
                    ${[1,2,3].map(i => {
                        const club = CLUBS_DATA.find(c => c.id === STATE.selections[`step${i}`]);
                        return `<div class="text-sm font-medium text-gray-800 py-2 flex items-start gap-2 border-b border-gray-100 last:border-0"><i class="fa-solid fa-check text-green-500 text-xs mt-1"></i> <div><div>${club ? club.name_zh : ''}</div><div class="text-xs text-gray-500">${club ? club.name_ms : ''}</div></div></div>`;
                    }).join('')}
                </div>
            `;
        }

        async function submitData() {
            const t = I18N.zh;
            DOM.btnNext.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            DOM.btnNext.disabled = true;
            DOM.btnPrev.disabled = true;
            
            try {
                if (db && STATE.userId) {
                    if (STATE.userId === 'demo-student-id') {
                        console.log("[Demo Mode] 模拟数据保存成功");
                    } else {
                        const docRef = doc(db, 'club_registrations', STATE.userId);
                        await setDoc(docRef, {
                            studentInfo: STATE.studentInfo,
                            parentEmail: STATE.parentEmail,
                            selections: STATE.selections,
                            submitted: true,
                            timestamp: new Date().toISOString()
                        });
                    }
                }
                showStep(5); 
            } catch (err) {
                console.error(err);
                alert("抱歉，保存数据时出错，请重试。\nRalat menyimpan data.");
                DOM.btnNext.innerHTML = `<span id="btn-next-text">${t.btnSubmit}</span> <i class="fa-solid fa-arrow-right"></i>`;
                DOM.btnNext.disabled = false;
                DOM.btnPrev.disabled = false;
            }
        }

        DOM.btnGoogleLogin.addEventListener('click', handleGoogleLogin);
        DOM.studentForm.addEventListener('submit', handleStudentSubmit);
        DOM.btnLogout.addEventListener('click', handleLogout);
        
        DOM.btnPrev.addEventListener('click', () => {
            if (STATE.step > 1) showStep(STATE.step - 1);
        });
        
        DOM.btnNext.addEventListener('click', () => {
            if (STATE.step < 4) {
                showStep(STATE.step + 1);
            } else if (STATE.step === 4) {
                submitData();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            setupStaticText();
            initFirebase();
        });
    </script>
</body>
</html>
